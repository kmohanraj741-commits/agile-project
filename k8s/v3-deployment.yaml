apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v3-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-app
      version: v3
  template:
    metadata:
      labels:
        app: devops-app
        version: v3
    spec:
      containers:
      - name: web-container
        image: yourdockerhubusername/my-devops-app:v3
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app-v3-service
spec:
  type: NodePort
  selector:
    app: devops-app
    version: v3
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30003
