apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v1-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-app
      version: v1
  template:
    metadata:
      labels:
        app: devops-app
        version: v1
    spec:
      containers:
      - name: web-container
        image: yourdockerhubusername/my-devops-app:v1
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app-v1-service
spec:
  type: NodePort
  selector:
    app: devops-app
    version: v1
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30001
